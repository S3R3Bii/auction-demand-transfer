name: Verify auction demand study
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/retrieve.py
      - run: python -m unittest discover -s tests -v
      - run: python src/verify.py validation
      - run: python src/verify.py test
      - run: python src/check_reproduction.py
